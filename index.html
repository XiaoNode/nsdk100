<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compound Interest Calculator</title>
  <!-- 引入Echarts库 -->
  <script src="./echarts.js"></script>
  <!-- NDX 查询结果数据（由 update_ndx.py 生成，每个交易日后更新） -->
  <script src="./ndx_data.js"></script>
  <style>
    .controls {
      margin: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    
    .control-group {
      display: inline-block;
      margin-right: 20px;
      margin-bottom: 10px;
    }
    
    label {
      display: inline-block;
      width: 120px;
      font-weight: bold;
    }
    
    input {
      width: 100px;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    
    button {
      padding: 8px 15px;
      background-color: #2f8c2f;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-left: 10px;
    }
    
    button:hover {
      background-color: #256d25;
    }

    /* ===== NDX 查询结果面板 ===== */
    .ndx-query {
      margin: 20px;
    }

    .ndx-card {
      padding: 16px 18px;
      border: 1px solid #e0e0e0;
      border-left: 5px solid #888;
      border-radius: 6px;
      background-color: #fafafa;
      line-height: 1.7;
    }

    .ndx-sentence {
      font-size: 16px;
      font-weight: 600;
      color: #222;
    }

    .ndx-meta {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    .ndx-meta code {
      background: #eee;
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* 涨：红（A股习惯）；跌：绿 */
    .ndx-up {
      border-left-color: #e23b3b;
      background-color: #fdf3f3;
    }

    .ndx-up .ndx-sentence {
      color: #c0392b;
    }

    .ndx-down {
      border-left-color: #2f9e44;
      background-color: #f1fbf3;
    }

    .ndx-down .ndx-sentence {
      color: #2f7d32;
    }

    .ndx-muted {
      border-left-color: #bbb;
      color: #777;
      font-weight: 400;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <!-- 控制面板 -->
  <div class="controls">
    <div class="control-group">
      <label for="monthlyDeposit">Monthly Deposit:</label>
      <input type="number" id="monthlyDeposit" value="2000" min="1">
    </div>
    <div class="control-group">
      <label for="annualInterestRate">Annual Interest Rate (%):</label>
      <input type="number" id="annualInterestRate" value="10" min="0" max="100" step="0.1">
    </div>
    <div class="control-group">
      <label for="totalYears">Total Years:</label>
      <input type="number" id="totalYears" value="30" min="1">
    </div>
    <button onclick="updateChart()">Update Chart</button>
  </div>

  <!-- 为图表准备的DOM容器 -->
  <div id="main" style="width: 1800px; height: 600px;"></div>

  <!-- NDX 查询结果展示 -->
  <div id="ndxQuery" class="ndx-query"></div>

  <script>
    // 初始化Echarts实例
    const myChart = echarts.init(document.getElementById('main'));

    // 计算并绘制图表的函数
    function calculateAndRenderChart() {
      // 获取用户输入的值
      const monthlyDeposit = parseFloat(document.getElementById('monthlyDeposit').value);
      const annualInterestRate = parseFloat(document.getElementById('annualInterestRate').value) / 100;
      const totalYears = parseInt(document.getElementById('totalYears').value);
      const totalMonths = totalYears * 12;

      // 月利率，将年利率分摊到每月
      const monthlyInterestRate = annualInterestRate / 12;

      // 用于存储每个月的账户余额和本金余额
      const balanceList = [];
      const principalList = [];
      let balance = 0;
      let principal = 0;

      // 模拟每月存钱及计算复利的过程
      for (let month = 0; month < totalMonths; month++) {
        // 先存入本月金额
        principal += monthlyDeposit;
        balance += monthlyDeposit;
        // 计算本月利息并加入余额（每月都计算利息）
        balance *= (1 + monthlyInterestRate);

        // 存储每月的总余额和本金余额
        balanceList.push(balance);
        principalList.push(principal);
      }

      // 准备x轴数据，格式化为"年-月"形式
      const xAxisData = [];
      for (let i = 0; i < totalMonths; i++) {
        const year = 2025 + Math.floor(i / 12);
        const month = (i % 12 + 1).toString().padStart(2, '0');
        xAxisData.push(`${year}-${month}`);
      }

      // Calculate current date index for red dot marker
      const now = new Date();
      const currentMonthStr = `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, '0')}`;
      const currentIndex = xAxisData.indexOf(currentMonthStr);
      const markPointData = [];
      if (currentIndex !== -1) {
        markPointData.push({
          coord: [currentMonthStr, balanceList[currentIndex]],
          value: 'Now',
          itemStyle: { color: 'red' }
        });
      }

      // 配置Echarts图表选项
      const option = {
        title: {
          // text: '复利计算器',
          // subtext: `每月存入: ${monthlyDeposit}元, 年利率: ${(annualInterestRate * 100).toFixed(1)}%, 总期数: ${totalYears}年`
          text: 'Compound Interest Calculator',
          subtext: `Monthly Deposit: ${monthlyDeposit}, Annual Rate: ${(annualInterestRate * 100).toFixed(1)}%, Period: ${totalYears} Years`
        },
        grid: {
          top: 100,
          containLabel: true
        },
        tooltip: {
          trigger: 'axis',
          formatter: function (params) {
            const totalAmount = params[0].data.toFixed(2);
            const principalAmount = params[1].data.toFixed(2);
            const interestAmount = (totalAmount - principalAmount).toFixed(2);
            return `时间：${params[0].axisValue}<br>总金额：${totalAmount} 元<br>本金：${principalAmount} 元<br>利息：${interestAmount} 元`;
          }
        },
        legend: {
          data: ['Total Amount', 'principal'],
          top: '30px'
        },
        xAxis: {
          type: 'category',
          data: xAxisData,
          axisLabel: {
            interval: Math.floor(xAxisData.length / 20) // 控制x轴标签密度，避免过于拥挤
          }
        },
        yAxis: {
          type: 'value',
          name: 'Amount (yuan)'
        },
        series: [
          {
            name: 'Total Amount',
            type: 'line',
            data: balanceList,
            lineStyle: { color: '#2f8c2f' }, // 绿色表示总余额
            markPoint: {
              symbol: 'circle',
              symbolSize: 8,
              label: { show: true, position: 'top', formatter: 'Now' },
              data: markPointData
            }
          },
          {
            name: 'principal',
            type: 'line',
            data: principalList,
            lineStyle: { color: '#ff9800' } // 橙色表示本金
          }
        ]
      };

      // 使用配置项渲染图表
      myChart.setOption(option);
      
      // 使图表响应窗口大小变化
      window.addEventListener('resize', function() {
        myChart.resize();
      });
    }

    // 页面加载完成后执行一次计算
    calculateAndRenderChart();
    // 渲染 NDX 查询结果面板
    renderNDXQuery();

    // 更新图表函数（供按钮调用）
    function updateChart() {
      calculateAndRenderChart();
    }

    // ===== NDX 查询结果渲染 =====
    // 读取 window.NDX_DATA（由 update_ndx.py 生成），渲染历史最高与最新收盘对比
    function renderNDXQuery() {
      const el = document.getElementById('ndxQuery');
      const idxName = (window.NDX_DATA && window.NDX_DATA.name) ? window.NDX_DATA.name : 'NDX100（纳斯达克100指数）';
      const shortName = 'NDX100';
      if (typeof window.NDX_DATA === 'undefined' || !window.NDX_DATA) {
        el.innerHTML = '<div class="ndx-card ndx-muted">' + idxName + ' 查询结果暂不可用：请运行 <code>update_ndx.py</code> 生成 ndx_data.js（每个交易日后更新）。</div>';
        return;
      }

      const d = window.NDX_DATA;
      const high = Number(d.highValue);
      const latest = Number(d.latestValue);
      const diff = latest - high;
      const pct = high !== 0 ? (diff / high) * 100 : 0;
      const up = diff >= 0;
      const dir = up ? '上升了' : '下降了';

      const fmt2 = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const highStr = fmt2(high);
      const latestStr = fmt2(latest);
      const diffStr = fmt2(Math.abs(diff));
      const pctStr = fmt2(Math.abs(pct));

      // 结果文案（时间以美国纳斯达克交易时区 America/New_York 为准）
      const sentence = idxName + ' 最高记录是 ' + highStr + ' 点（' + cnDate(d.highDate) + '），' +
        '今天是 ' + cnDate(d.latestDate) + '（美东时间）' + shortName + ' 为 ' + latestStr + ' 点，' +
        '距离最高点' + dir + ' ' + diffStr + ' 点，' + dir + ' ' + pctStr + '%。';

      let updatedLine = '';
      if (d.updatedAtEpoch) {
        const ue = new Date(d.updatedAtEpoch * 1000);
        const fmt = new Intl.DateTimeFormat('zh-CN', {
          timeZone: 'America/New_York',
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: false
        });
        updatedLine = '数据更新于（美东时间）：' + fmt.format(ue);
      }

      const cls = up ? 'ndx-up' : 'ndx-down';
      el.innerHTML =
        '<div class="ndx-card ' + cls + '">' +
          '<div class="ndx-sentence">' + sentence + '</div>' +
          '<div class="ndx-meta">' + updatedLine +
            ' ｜ 数据源：' + escapeHtml(d.source || '') + '</div>' +
        '</div>';
    }

    // YYYY-MM-DD -> YYYY年M月D日
    function cnDate(s) {
      const parts = String(s).split('-').map(Number);
      if (parts.length < 3) return String(s);
      return parts[0] + '年' + parts[1] + '月' + parts[2] + '日';
    }

    // 简易 HTML 转义，防止数据源字段注入
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // 当输入框值改变时也可以更新图表（可选功能）
    document.getElementById('monthlyDeposit').addEventListener('change', updateChart);
    document.getElementById('annualInterestRate').addEventListener('change', updateChart);
    document.getElementById('totalYears').addEventListener('change', updateChart);
  </script>
</body>

</html>
